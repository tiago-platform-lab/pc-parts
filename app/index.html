<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Parts</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='10' width='44' height='44' rx='8' fill='%2322d3ee'/%3E%3Crect x='22' y='22' width='20' height='20' rx='3' fill='%230b1020'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #070b16;
      --panel: #0e1424;
      --edge: #1d2742;
      --text: #e6ecff;
      --muted: #8a96b8;
      --cyan: #22d3ee;
      --violet: #a78bfa;
      --pink: #f472b6;
      --lime: #a3e635;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(50% 40% at 15% 0%, rgba(34, 211, 238, 0.14), transparent 70%),
        radial-gradient(45% 40% at 100% 30%, rgba(167, 139, 250, 0.14), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* faint circuit grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(70% 60% at 50% 30%, #000, transparent);
      pointer-events: none;
    }
    .wrap { position: relative; max-width: 1120px; margin: 0 auto; padding: 48px 20px 40px; }

    header { text-align: center; margin-bottom: 40px; }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hint { margin: 12px 0 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
    .part {
      --c: var(--cyan);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 280px;
      padding: 22px 18px 18px;
      text-align: center;
      color: inherit;
      font: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 60%), var(--panel);
      border: 1px solid var(--edge);
      border-radius: 20px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(.2, .8, .2, 1), border-color 0.35s, box-shadow 0.35s;
      animation: enter 0.6s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: calc(var(--i) * 70ms);
    }
    @keyframes enter { from { opacity: 0; transform: translateY(18px); } }
    .part:hover, .part:focus-visible, .part.active {
      transform: translateY(-6px);
      border-color: var(--c);
      box-shadow: 0 18px 50px -18px var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);
      outline: none;
    }
    .art { width: 132px; height: 132px; transition: transform 0.45s cubic-bezier(.2, .8, .2, 1); }
    .part:hover .art, .part:focus-visible .art, .part.active .art { transform: scale(1.08) translateY(-4px); }
    .name { margin-top: 10px; font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em; }
    .tag { margin-top: 2px; font-size: 0.75rem; color: var(--c); letter-spacing: 0.1em; text-transform: uppercase; }
    .info {
      margin-top: 12px;
      max-height: 0;
      opacity: 0;
      font-size: 0.9rem;
      line-height: 1.45;
      color: var(--muted);
      transform: translateY(8px);
      transition: max-height 0.45s ease, opacity 0.35s ease, transform 0.35s ease;
    }
    .part:hover .info, .part:focus-visible .info, .part.active .info { max-height: 120px; opacity: 1; transform: none; }

    /* shared SVG styling */
    .art .stroke { fill: none; stroke: var(--c); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .art .soft { fill: color-mix(in srgb, var(--c) 14%, transparent); }
    .art .solid { fill: var(--c); }

    /* per-part animations, only while hovered/focused */
    .part .spin { transform-box: fill-box; transform-origin: center; }
    .part:hover .spin, .part:focus-visible .spin, .part.active .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .part .pulse { opacity: 0.25; }
    .part:hover .pulse, .part:focus-visible .pulse, .part.active .pulse { animation: pulse 1.2s ease-in-out infinite; }
    .pulse:nth-of-type(2n) { animation-delay: 0.2s !important; }
    .pulse:nth-of-type(3n) { animation-delay: 0.4s !important; }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

    .part .flow { stroke-dasharray: 6 10; }
    .part:hover .flow, .part:focus-visible .flow, .part.active .flow { animation: flow 0.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }

    .part .bolt { opacity: 0.35; transform-box: fill-box; transform-origin: center; }
    .part:hover .bolt, .part:focus-visible .bolt, .part.active .bolt { animation: bolt 0.9s ease-in-out infinite; }
    @keyframes bolt { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }

    .part .bar { transform-box: fill-box; transform-origin: bottom; }
    .part:hover .bar, .part:focus-visible .bar, .part.active .bar { animation: bar 1s ease-in-out infinite alternate; }
    .bar:nth-of-type(2) { animation-delay: 0.15s !important; }
    .bar:nth-of-type(3) { animation-delay: 0.3s !important; }
    @keyframes bar { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }

    @media (prefers-reduced-motion: reduce) {
      .part, .part * { animation: none !important; transition: none !important; }
      .info { max-height: 120px; opacity: 1; transform: none; }
    }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .part { min-height: 0; } }

    footer { margin-top: 36px; text-align: center; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Inside a PC</h1>
      <p class="hint">Hover or tap a part to see what it does.</p>
    </header>

    <main class="grid">
      <!-- CPU -->
      <button class="part" style="--i:0; --c: var(--cyan)">
        <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
          <g class="stroke">
            <path d="M42 18v12M54 18v12M66 18v12M78 18v12M42 90v12M54 90v12M66 90v12M78 90v12M18 42h12M18 54h12M18 66h12M18 78h12M90 42h12M90 54h12M90 66h12M90 78h12"/>
            <rect x="30" y="30" width="60" height="60" rx="8"/>
          </g>
          <rect class="soft" x="30" y="30" width="60" height="60" rx="8"/>
          <rect class="solid pulse" x="44" y="44" width="32" height="32" rx="4"/>
        </svg>
        <span class="name">CPU</span>
        <span class="tag">Processor</span>
        <span class="info">The brain of the computer. It runs the instructions of every program, billions of times per second.</span>
      </button>

      <!-- GPU -->
      <button class="part" style="--i:1; --c: var(--violet)">
        <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="soft" x="10" y="34" width="100" height="48" rx="8"/>
          <g class="stroke">
            <rect x="10" y="34" width="100" height="48" rx="8"/>
            <path d="M22 82v10h14v-10M48 82v10M56 82v10M64 82v10M72 82v10"/>
          </g>
          <g class="spin"><circle class="stroke" cx="38" cy="58" r="15"/><path class="solid" d="M38 58l0-13a13 13 0 0 1 9 4zM38 58l13 0a13 13 0 0 1-4 9zM38 58l0 13a13 13 0 0 1-9-4zM38 58l-13 0a13 13 0 0 1 4-9z"/></g>
          <g class="spin"><circle class="stroke" cx="82" cy="58" r="15"/><path class="solid" d="M82 58l0-13a13 13 0 0 1 9 4zM82 58l13 0a13 13 0 0 1-4 9zM82 58l0 13a13 13 0 0 1-9-4zM82 58l-13 0a13 13 0 0 1 4-9z"/></g>
        </svg>
        <span class="name">GPU</span>
        <span class="tag">Graphics card</span>
        <span class="info">Draws everything you see on screen. Thousands of small cores work in parallel for games, video and AI.</span>
      </button>

      <!-- RAM -->
      <button class="part" style="--i:2; --c: var(--pink)">
        <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="soft" x="8" y="40" width="104" height="36" rx="4"/>
          <g class="stroke">
            <rect x="8" y="40" width="104" height="36" rx="4"/>
            <path d="M14 76v10M22 76v10M30 76v10M38 76v10M46 76v10M58 76v10M66 76v10M74 76v10M82 76v10M90 76v10M98 76v10M106 76v10"/>
          </g>
          <rect class="solid pulse" x="16" y="48" width="16" height="20" rx="2"/>
          <rect class="solid pulse" x="38" y="48" width="16" height="20" rx="2"/>
          <rect class="solid pulse" x="66" y="48" width="16" height="20" rx="2"/>
          <rect class="solid pulse" x="88" y="48" width="16" height="20" rx="2"/>
        </svg>
        <span class="name">RAM</span>
        <span class="tag">Memory</span>
        <span class="info">Short-term memory. It holds what you are using right now, so the CPU can reach it fast. Cleared on power off.</span>
      </button>

      <!-- Motherboard -->
      <button class="part" style="--i:3; --c: var(--lime)">
        <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="soft" x="14" y="14" width="92" height="92" rx="8"/>
          <g class="stroke">
            <rect x="14" y="14" width="92" height="92" rx="8"/>
            <rect x="30" y="28" width="26" height="26" rx="3"/>
            <path d="M68 26v36M76 26v36M26 74h68M26 86h52"/>
          </g>
          <g class="stroke flow"><path d="M56 41h12M43 54v20M76 62v12M94 74v18H78"/></g>
        </svg>
        <span class="name">Motherboard</span>
        <span class="tag">Mainboard</span>
        <span class="info">The backbone. Every part plugs into it, and it carries power and data between all of them.</span>
      </button>

      <!-- SSD -->
      <button class="part" style="--i:4; --c: var(--cyan)">
        <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="soft" x="12" y="44" width="96" height="30" rx="4"/>
          <g class="stroke">
            <rect x="12" y="44" width="96" height="30" rx="4"/>
            <path d="M12 52h-4v14h4"/>
            <circle cx="102" cy="59" r="3"/>
          </g>
          <rect class="solid pulse" x="22" y="50" width="20" height="18" rx="2"/>
          <rect class="solid pulse" x="46" y="50" width="20" height="18" rx="2"/>
          <rect class="solid pulse" x="70" y="50" width="20" height="18" rx="2"/>
          <path class="stroke flow" d="M18 86h84"/>
        </svg>
        <span class="name">SSD</span>
        <span class="tag">Storage</span>
        <span class="info">Long-term storage for the system, apps and files. Keeps everything when the PC is off, and loads it quickly.</span>
      </button>

      <!-- PSU -->
      <button class="part" style="--i:5; --c: var(--amber)">
        <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="soft" x="18" y="26" width="84" height="68" rx="8"/>
          <g class="stroke">
            <rect x="18" y="26" width="84" height="68" rx="8"/>
            <circle cx="60" cy="60" r="22"/>
            <path d="M102 44h8M102 52h8M102 68h8M102 76h8"/>
          </g>
          <path class="solid bolt" d="M64 42L50 63h9l-4 16 14-22h-9z"/>
        </svg>
        <span class="name">PSU</span>
        <span class="tag">Power supply</span>
        <span class="info">Turns the power from the wall into the steady, safe voltages that each part needs.</span>
      </button>

      <!-- Cooler -->
      <button class="part" style="--i:6; --c: var(--violet)">
        <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="soft" x="22" y="22" width="76" height="76" rx="14"/>
          <rect class="stroke" x="22" y="22" width="76" height="76" rx="14"/>
          <g class="spin">
            <circle class="stroke" cx="60" cy="60" r="28"/>
            <path class="solid" d="M60 60c-4-10-2-20 6-24 4 8 0 18-6 24zM60 60c10-4 20-2 24 6-8 4-18 0-24-6zM60 60c4 10 2 20-6 24-4-8 0-18 6-24zM60 60c-10 4-20 2-24-6 8-4 18 0 24 6z"/>
            <circle class="solid" cx="60" cy="60" r="5"/>
          </g>
        </svg>
        <span class="name">Cooler</span>
        <span class="tag">Cooling</span>
        <span class="info">Pulls heat away from the CPU and out of the case, so parts can run fast without slowing down.</span>
      </button>

      <!-- Case -->
      <button class="part" style="--i:7; --c: var(--pink)">
        <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="soft" x="32" y="12" width="56" height="96" rx="6"/>
          <g class="stroke">
            <rect x="32" y="12" width="56" height="96" rx="6"/>
            <circle cx="60" cy="28" r="4"/>
            <path d="M42 46h36M42 54h36M42 62h36"/>
          </g>
          <rect class="solid bar" x="44" y="80" width="8" height="18" rx="2"/>
          <rect class="solid bar" x="56" y="80" width="8" height="18" rx="2"/>
          <rect class="solid bar" x="68" y="80" width="8" height="18" rx="2"/>
        </svg>
        <span class="name">Case</span>
        <span class="tag">Chassis</span>
        <span class="info">Holds and protects every part, and guides the airflow that keeps the whole system cool.</span>
      </button>
    </main>

    <footer>PC Parts · AI Delivery Team</footer>
  </div>

  <script>
    // Touch screens have no hover: a tap opens one part at a time.
    const parts = document.querySelectorAll('.part');
    parts.forEach(p => p.addEventListener('click', () => {
      const open = p.classList.contains('active');
      parts.forEach(x => x.classList.remove('active'));
      if (!open) p.classList.add('active');
    }));
  </script>
</body>
</html>
